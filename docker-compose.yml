services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: leadforge
      POSTGRES_USER: leadforge
      POSTGRES_PASSWORD: leadforge-dev
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadforge -d leadforge"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["/app/bin/migrate", "up"]
    environment:
      DATABASE_URL: postgres://leadforge:leadforge-dev@postgres:5432/leadforge?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  server:
    build: .
    ports: ["8080:8080"]
    environment:
      APP_ENV: local
      APP_ADDR: :8080
      APP_URL: http://localhost:8080
      DATABASE_URL: postgres://leadforge:leadforge-dev@postgres:5432/leadforge?sslmode=disable
      REDIS_ADDR: redis:6379
      SESSION_SECRET: local-session-secret-change-me-please
      APP_ENCRYPTION_KEY: local-encryption-key-change-me-please
      BROWSER_ENABLED: "true"
      ALLOW_INSECURE_WEBHOOKS: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: .
    entrypoint: ["/app/bin/worker"]
    environment: &app-env
      APP_ENV: local
      APP_URL: http://server:8080
      DATABASE_URL: postgres://leadforge:leadforge-dev@postgres:5432/leadforge?sslmode=disable
      REDIS_ADDR: redis:6379
      SESSION_SECRET: local-session-secret-change-me-please
      APP_ENCRYPTION_KEY: local-encryption-key-change-me-please
      BROWSER_ENABLED: "true"
      ALLOW_INSECURE_WEBHOOKS: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  scheduler:
    build: .
    entrypoint: ["/app/bin/scheduler"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
